# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html
# Mirrors .github/workflows/docs.yml so both builds behave the same way.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"  # sphinx 9.1 requires >=3.12; rubella's own deps are mocked in conf.py

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true  # same as `sphinx-build -W` in CI

python:
  install:
    - requirements: docs/requirements.txt
