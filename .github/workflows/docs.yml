name: Build documentation

# The documentation is hosted on Read the Docs (https://rubella.readthedocs.io),
# which rebuilds it on every push to main (see .readthedocs.yaml).
# This workflow only checks that the docs build without warnings, so that
# documentation errors are caught on pull requests before merging.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # adds a "Run workflow" button to build on demand

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # sphinx 9.1 requires >=3.12; rubella's own deps are mocked, so this is independent of its runtime
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Build the HTML documentation
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
